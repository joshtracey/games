<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Boggle — Multiplayer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<main>
  <div class="topbar">
    <h1>Multiplayer</h1>
    <a class="back" href="index.html">← Boggle</a>
  </div>
  <div class="sub">Words that more than one player finds cancel out</div>

  <!-- Entry -->
  <div class="panel" id="v-entry">
    <button class="btn wide" id="host">Host a new game</button>
    <div class="spacer"></div>
    <div class="row" style="margin-bottom:0">
      <input class="text" id="join-code" maxlength="3" placeholder="ABC" autocomplete="off"
             style="flex:1;text-transform:uppercase;letter-spacing:.3em;text-align:center;font-weight:700" />
      <button class="btn" id="join">Join</button>
    </div>
    <div class="message" id="entry-msg"></div>
  </div>

  <!-- Lobby -->
  <div class="panel" id="v-lobby" style="display:none">
    <div class="lbl center">Room code — share it out loud</div>
    <div class="code-display" id="code"></div>
    <div class="player-list" id="players"></div>
    <div id="host-controls" style="display:none">
      <div class="row" style="justify-content:center">
        <span class="lbl">Board:</span>
        <button class="seg" id="size4">4×4</button>
        <button class="seg" id="size5">5×5</button>
      </div>
      <button class="btn wide" id="start-round">Start round</button>
    </div>
    <div class="message" id="lobby-msg"></div>
    <div class="spacer"></div>
    <button class="btn wide danger" id="leave">Leave room</button>
  </div>

  <!-- Countdown -->
  <div class="panel center" id="v-count" style="display:none">
    <div class="lbl">Get ready…</div>
    <div class="timer" id="count-num" style="font-size:3.5rem">3</div>
  </div>

  <!-- Game -->
  <div class="panel" id="v-game" style="display:none">
    <div class="row" style="justify-content:space-between">
      <div class="timer" id="timer">3:00</div>
      <div class="lbl"><span id="word-count">0</span> words</div>
    </div>
    <div id="board" class="board"></div>
    <div class="wordbar">
      <div class="current" id="current">&nbsp;</div>
      <button class="btn" id="submit">✓</button>
      <button class="btn ghost" id="clear">✕</button>
    </div>
    <div class="message" id="msg">Only you can see your words.</div>
    <div class="words" id="words"></div>
  </div>

  <!-- Results -->
  <div class="panel" id="v-results" style="display:none">
    <h2 style="margin:4px 0 10px" class="center">Results</h2>
    <div class="results-grid" id="results"></div>
    <div class="message" style="margin-top:8px">Greyed words were found by more than one player and score nothing.</div>
    <div class="spacer"></div>
    <div id="results-host" style="display:none"><button class="btn wide" id="again">Back to lobby</button></div>
    <div class="message" id="results-wait"></div>
    <div class="spacer"></div>
    <button class="btn wide danger" id="leave2">Leave room</button>
  </div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="words.js"></script>
<script src="core.js"></script>
<script src="firebase-config.js"></script>
<script>
'use strict';
const PREROLL_MS = 3000;
const GAME_MS = 180000;
const $ = (id) => document.getElementById(id);
const name = ensurePlayerName();
const fb = fbBoot();

let uid = null;
let offset = 0;               // server clock offset
let code = null;              // current room code
let room = null;              // latest room snapshot value
let roomRef = null;
let boardUI = null;
let boardRound = -1;          // round the current board UI was built for
let myWords = new Map();      // word -> true (this round, local echo)
let hostSize = getSettings().size;
let phaseTick = null;

const serverNow = () => Date.now() + offset;

/* ---------- view plumbing ---------- */
const VIEWS = ['v-entry', 'v-lobby', 'v-count', 'v-game', 'v-results'];
function show(view) {
  VIEWS.forEach((v) => { $(v).style.display = v === view ? '' : 'none'; });
}
function setMsg(id, text, cls) {
  $(id).textContent = text;
  $(id).className = 'message ' + (cls || '');
}

/* ---------- entry ---------- */
$('host').onclick = hostRoom;
$('join').onclick = () => joinRoom($('join-code').value.trim().toUpperCase());
$('join-code').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('join').click(); });

async function ready() {
  if (!fb) throw new Error('offline');
  const u = await fb.authReady;
  if (!u) throw new Error('auth');
  uid = u.uid;
  offset = await fbServerOffset(fb.db);
}

function roomAlive(r) {
  return r && r.expiresAt && serverNow() < r.expiresAt;
}

async function hostRoom() {
  setMsg('entry-msg', 'Creating room…');
  try {
    await ready();
    let c, tries = 0;
    for (;;) {
      c = randomRoomCode();
      const snap = await fb.db.ref('boggle/rooms/' + c).once('value');
      if (!roomAlive(snap.val()) || ++tries > 30) break;
    }
    await fb.db.ref('boggle/rooms/' + c).set({
      createdAt: firebase.database.ServerValue.TIMESTAMP,
      expiresAt: hfxNextMidnight(),   // rooms die at Atlantic midnight
      host: uid,
      hostName: name,
      size: hostSize,
      state: 'lobby',
      round: 0,
      players: { [uid]: { name } },
    });
    enterRoom(c);
  } catch (e) {
    setMsg('entry-msg', 'Couldn’t create a room — check your connection.', 'err');
  }
}

async function joinRoom(c) {
  if (!/^[A-Z]{3}$/.test(c)) return setMsg('entry-msg', 'Codes are 3 letters.', 'err');
  setMsg('entry-msg', 'Joining…');
  try {
    await ready();
    const snap = await fb.db.ref('boggle/rooms/' + c).once('value');
    if (!roomAlive(snap.val())) return setMsg('entry-msg', 'No room with that code.', 'err');
    await fb.db.ref(`boggle/rooms/${c}/players/${uid}`).set({ name });
    enterRoom(c);
  } catch (e) {
    setMsg('entry-msg', 'Couldn’t join — check your connection.', 'err');
  }
}

function enterRoom(c) {
  code = c;
  sessionStorage.setItem('boggle-room', c);
  $('code').textContent = c;
  roomRef = fb.db.ref('boggle/rooms/' + c);
  roomRef.on('value', (snap) => {
    room = snap.val();
    render();
  });
  clearInterval(phaseTick);
  phaseTick = setInterval(() => { if (room && room.state === 'playing') render(); }, 200);
}

function leaveRoom() {
  if (roomRef) roomRef.off();
  if (code && uid && room && room.host !== uid) {
    fb.db.ref(`boggle/rooms/${code}/players/${uid}`).remove().catch(() => {});
  }
  sessionStorage.removeItem('boggle-room');
  clearInterval(phaseTick);
  roomRef = null; room = null; code = null; boardRound = -1;
  show('v-entry');
  setMsg('entry-msg', '');
}
$('leave').onclick = leaveRoom;
$('leave2').onclick = leaveRoom;

/* ---------- host controls ---------- */
function paintSize() {
  $('size4').classList.toggle('active', hostSize === 4);
  $('size5').classList.toggle('active', hostSize === 5);
}
function setHostSize(s) {
  hostSize = s;
  paintSize();
  if (roomRef && room && room.host === uid && room.state === 'lobby') {
    roomRef.update({ size: s });
  }
}
$('size4').onclick = () => setHostSize(4);
$('size5').onclick = () => setHostSize(5);

$('start-round').onclick = () => {
  roomRef.update({
    state: 'playing',
    size: hostSize,
    seed: Math.floor(Math.random() * 0xffffffff),
    round: (room.round || 0) + 1,
    startAt: firebase.database.ServerValue.TIMESTAMP,
    words: null,
  });
};
$('again').onclick = () => roomRef.update({ state: 'lobby', words: null });

/* ---------- game input ---------- */
$('submit').onclick = () => boardUI && boardUI.submitCurrent();
$('clear').onclick = () => boardUI && boardUI.clearPath();

function submitWord(word) {
  const show = word.toUpperCase();
  if (myWords.has(word)) return setMsg('msg', `${show} — already found`, 'err');
  const res = checkWord(word, roundBoard(), room.size);
  if (!res.ok) return setMsg('msg', `${show} — ${res.reason}`, 'err');
  myWords.set(word, true);
  fb.db.ref(`boggle/rooms/${code}/words/${uid}/${word}`).set(true).catch(() => {});
  setMsg('msg', `${show} ✓`, 'ok');
  $('word-count').textContent = myWords.size;
  const chip = document.createElement('span');
  chip.className = 'word-chip';
  chip.textContent = show;
  $('words').prepend(chip);
}

function roundBoard() {
  return generateBoard(room.size, mulberry32(room.seed >>> 0));
}

/* ---------- render loop ---------- */
function render() {
  if (!code) return;
  if (!roomAlive(room)) {
    if (room === null && roomRef) { // room deleted or expired away
      leaveRoom();
      setMsg('entry-msg', 'That room has closed.', 'err');
    } else if (room && room.expiresAt && serverNow() >= room.expiresAt) {
      leaveRoom();
      setMsg('entry-msg', 'That room expired at midnight.', 'err');
    }
    return;
  }

  const isHost = room.host === uid;

  if (room.state === 'lobby') {
    boardRound = -1;
    show('v-lobby');
    const players = Object.values(room.players || {});
    $('players').innerHTML = players
      .map((p) => `<span class="player-pill">${escapeHtml(p.name)}</span>`).join('');
    $('host-controls').style.display = isHost ? '' : 'none';
    if (isHost) {
      hostSize = room.size || hostSize;
      paintSize();
      setMsg('lobby-msg', players.length < 2 ? 'Waiting for players to join…' : 'Ready when you are!');
    } else {
      setMsg('lobby-msg', `Waiting for ${escapeHtml(room.hostName)} to start…`);
    }
    return;
  }

  // state === 'playing': phase depends on server time
  const playStart = room.startAt + PREROLL_MS;
  const playEnd = playStart + GAME_MS;
  const now = serverNow();

  if (now < playStart) {
    show('v-count');
    $('count-num').textContent = Math.max(1, Math.ceil((playStart - now) / 1000));
    prepareRound();
    return;
  }

  if (now < playEnd) {
    prepareRound();
    show('v-game');
    const secLeft = Math.ceil((playEnd - now) / 1000);
    $('timer').textContent = fmtTime(secLeft);
    $('timer').classList.toggle('urgent', secLeft <= 10);
    return;
  }

  showResults(isHost);
}

// Build the board UI once per round.
function prepareRound() {
  if (boardRound === room.round) return;
  boardRound = room.round;
  myWords = new Map();
  $('words').innerHTML = '';
  $('word-count').textContent = '0';
  setMsg('msg', 'Only you can see your words.');
  boardUI = createBoardUI($('board'), {
    size: room.size, tiles: roundBoard(), rotated: false,
    onPathChange: (w) => { $('current').textContent = w ? w.toUpperCase() : ' '; },
    onSubmit: submitWord,
  });
  // Restore my words if I refreshed mid-round.
  const mine = (room.words && room.words[uid]) || {};
  for (const w of Object.keys(mine)) {
    myWords.set(w, true);
    const chip = document.createElement('span');
    chip.className = 'word-chip';
    chip.textContent = w.toUpperCase();
    $('words').prepend(chip);
  }
  $('word-count').textContent = myWords.size;
}

let resultsKey = '';
function showResults(isHost) {
  show('v-results');
  $('results-host').style.display = isHost ? '' : 'none';
  $('results-wait').textContent = isHost ? '' : `Waiting for ${room.hostName} to start the next round…`;
  // Rebuild only when the round or the word lists change (a slow client's
  // final word can arrive moments after the timer ends).
  const key = room.round + '|' + JSON.stringify(room.words || {});
  if (key === resultsKey) return;
  resultsKey = key;

  const board = roundBoard();
  const players = room.players || {};
  const words = room.words || {};

  // Count how many players found each valid word.
  const counts = {};
  for (const [pid, list] of Object.entries(words)) {
    for (const w of Object.keys(list || {})) {
      if (checkWord(w, board, room.size).ok) counts[w] = (counts[w] || 0) + 1;
    }
  }

  $('results').innerHTML = Object.entries(players).map(([pid, p]) => {
    const list = Object.keys(words[pid] || {}).sort();
    let total = 0;
    const chips = list.map((w) => {
      const valid = checkWord(w, board, room.size);
      if (!valid.ok) return '';
      const dup = counts[w] > 1;
      if (!dup) total += valid.score;
      return `<span class="word-chip ${dup ? 'cancelled' : 'unique'}">${w.toUpperCase()}` +
             (dup ? '' : `<span class="pts">+${valid.score}</span>`) + `</span>`;
    }).join('');
    return `<div class="result-col"><h3>${escapeHtml(p.name)} — <span class="total">${total}</span></h3>` +
           `<div class="words">${chips || '<span class="lbl">no words</span>'}</div></div>`;
  }).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ---------- boot: rejoin after a refresh ---------- */
(async () => {
  if (!fb) { setMsg('entry-msg', 'Multiplayer needs a connection.', 'err'); return; }
  paintSize();
  const saved = sessionStorage.getItem('boggle-room');
  if (!saved) return;
  try {
    await ready();
    const snap = await fb.db.ref('boggle/rooms/' + saved).once('value');
    const r = snap.val();
    if (roomAlive(r) && r.players && r.players[uid]) enterRoom(saved);
    else sessionStorage.removeItem('boggle-room');
  } catch (e) {}
})();
</script>
</body>
</html>
