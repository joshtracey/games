<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Boggle — TV Screen</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="tv">
<main class="wide">
  <div class="topbar">
    <h1>Boggle</h1>
    <a class="back" href="index.html">← Menu</a>
  </div>

  <div class="panel">
    <div class="row">
      <span class="lbl">Board:</span>
      <button class="seg" id="size4">4×4</button>
      <button class="seg" id="size5">5×5</button>
      <button class="btn ghost" id="new" style="margin-left:auto">New game</button>
    </div>

    <div class="timer timer-row" id="timer-top" style="font-size:2.4rem">3:00</div>
    <div id="board" class="board"></div>
    <div class="timer timer-row" id="timer-bottom" style="font-size:2.4rem">3:00</div>
    <div class="message" id="msg" style="font-size:1.1rem">Tap “New game” to shake the dice.</div>
  </div>
</main>
<script src="core.js"></script>
<script>
'use strict';
const GAME_SECONDS = 180;
const $ = (id) => document.getElementById(id);
let size = getSettings().size;

const countdown = createCountdown(
  (sec) => {
    const t = fmtTime(sec);
    $('timer-top').textContent = t;
    $('timer-bottom').textContent = t;
    const urgent = sec <= 10;
    $('timer-top').classList.toggle('urgent', urgent);
    $('timer-bottom').classList.toggle('urgent', urgent);
  },
  () => {
    $('msg').textContent = "Time's up — pencils down!";
    buzz();
  }
);

function buzz() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 440;
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.8);
  } catch (e) {}
}

function paintSize() {
  $('size4').classList.toggle('active', size === 4);
  $('size5').classList.toggle('active', size === 5);
}
$('size4').onclick = () => { size = 4; paintSize(); newGame(); };
$('size5').onclick = () => { size = 5; paintSize(); newGame(); };
$('new').onclick = newGame;

function newGame() {
  const board = generateBoard(size);
  createBoardUI($('board'), { size, tiles: board, rotated: false, interactive: false });
  $('msg').textContent = 'Go!';
  countdown.start(GAME_SECONDS * 1000);
}
paintSize();
</script>
<script src="../wakelock.js"></script>
</body>
</html>
